<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ravion Official — Investment & Earning Web App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Professional Dark Black & Light Blue Design System */
    :root {
      --bg-cream: #070B12;
      --bg-warm: #0D1420;
      --card-bg: #111A29;
      --card-tint: #152236;
      --gold: #38BDF8;
      --gold-dark: #0284C7;
      --gold-deep: #7DD3FC;
      --gold-soft: rgba(56, 189, 248, 0.14);
      --text-main: #F0F9FF;
      --text-muted: #94A3B8;
      --border: #1E324C;
      --success: #34D399;
      --success-bg: rgba(16, 185, 129, 0.16);
      --danger: #F87171;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --warning: #FBBF24;
      --warning-bg: rgba(245, 158, 11, 0.16);
      --shadow: 0 12px 30px rgba(2, 6, 23, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      background: #04070C;
      color: var(--text-main);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      margin: 0 auto;
      background: linear-gradient(180deg, #070B12 0%, var(--bg-cream) 45%, var(--bg-warm) 100%);
      box-shadow: 0 20px 54px rgba(0, 0, 0, 0.75);
      border-left: 1px solid rgba(56, 189, 248, 0.12);
      border-right: 1px solid rgba(56, 189, 248, 0.12);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 84px;
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      max-width: 440px;
      margin: 0 auto;
      z-index: 9999;
      background: radial-gradient(circle at top, #0E2238 0%, #09121F 55%, #05080F 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-badge {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #04101A;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(56, 189, 248, 0.32);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .splash-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .splash-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
    }

    .splash-sub {
      font-size: 13px;
      color: var(--gold-deep);
      margin-top: 6px;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 18, 30, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #04101A;
      font-weight: 800;
      font-size: 15px;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.28);
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 0.6px;
      color: var(--gold-deep);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .icon-btn:hover {
      border-color: var(--gold);
      background: var(--card-tint);
    }

    .main-content {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-wrapper {
      padding: 18px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-hero {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-warm);
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #04101A;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-main); }
    .phone-row { display: flex; gap: 8px; }

    .prefix-box {
      background: var(--bg-warm);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      font-weight: 800;
      font-size: 14px;
      color: var(--gold);
    }

    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #0B121E;
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--gold);
    }

    .captcha-box { display: flex; align-items: center; gap: 10px; }
    .captcha-code {
      min-width: 96px;
      text-align: center;
      padding: 11px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, #132944, #0C1B2E);
      border: 1px dashed var(--gold);
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold-deep);
      font-size: 15px;
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #04101A;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
    }

    .btn-sm {
      border: none;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-approve { background: var(--success-bg); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
    .btn-reject { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }
    .btn-edit { background: var(--gold-soft); color: var(--gold-deep); border: 1px solid rgba(56, 189, 248, 0.3); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      box-shadow: var(--shadow);
    }

    .banner-card {
      background: linear-gradient(135deg, #0A192F 0%, #0F294A 55%, #0369A1 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #F0F9FF;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 28px rgba(2, 132, 199, 0.24);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .banner-pill {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: var(--gold-deep);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .quick-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
    }

    .quick-item:hover {
      border-color: var(--gold);
      background: var(--card-tint);
    }

    .quick-ico {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gold-soft);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title { font-size: 15px; font-weight: 800; color: var(--text-main); }
    .ticker-list { display: flex; flex-direction: column; gap: 10px; }

    .ticker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--bg-warm);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .ticker-row.active {
      border-color: var(--gold);
      background: #12243A;
    }

    .coin-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--card-tint);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
      color: var(--gold-deep);
      flex-shrink: 0;
    }

    .change-up { color: var(--success); font-size: 12px; font-weight: 700; }
    .change-down { color: var(--danger); font-size: 12px; font-weight: 700; }

    .pkg-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pkg-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
    }

    .pkg-logo-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: var(--gold-soft);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
      color: var(--gold-deep);
      flex-shrink: 0;
      overflow: hidden;
    }

    .pkg-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    .pkg-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pkg-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gold-soft);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--gold-deep);
    }

    .pkg-metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      background: var(--bg-warm);
      padding: 12px 13px;
      border-radius: 13px;
      border: 1px solid var(--border);
    }

    .pkg-metric-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
    }

    .pkg-metric-k {
      color: var(--text-muted);
      font-weight: 600;
    }

    .pkg-metric-v {
      color: var(--text-main);
      font-weight: 800;
      white-space: nowrap;
    }

    .pkg-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 2px;
    }

    .pkg-price-display {
      font-size: 19px;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
    }

    .pkg-buy-btn {
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #04101A;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.28);
      white-space: nowrap;
    }

    .pkg-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-warm);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-k { font-size: 10px; color: var(--text-muted); font-weight: 600; }
    .stat-v { font-size: 13px; font-weight: 800; color: var(--text-main); margin-top: 2px; }

    .balance-card {
      background: linear-gradient(135deg, #0C2340 0%, #0369A1 60%, var(--gold-dark) 100%);
      border: 1px solid rgba(125, 211, 252, 0.4);
      color: #F0F9FF;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 28px rgba(2, 132, 199, 0.28);
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .avatar-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(7, 11, 18, 0.45);
      border: 2px solid var(--gold-deep);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--gold-deep);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .balance-amount { font-size: 28px; font-weight: 800; margin: 4px 0 12px; }
    .mini-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini-stat {
      background: rgba(7, 11, 18, 0.34);
      border: 1px solid rgba(125, 211, 252, 0.22);
      border-radius: 12px;
      padding: 9px 10px;
    }

    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .menu-row:hover {
      border-color: var(--gold);
      background: var(--card-tint);
    }

    .status-pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .st-pending { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
    .st-approved { background: var(--success-bg); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
    .st-rejected { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }

    .subtab-scroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
    .subtab-btn {
      border: 1px solid var(--border);
      background: var(--bg-warm);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .subtab-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #04101A;
      border-color: transparent;
    }

    .three-dot-menu-panel {
      background: var(--bg-warm);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 12px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .three-dot-item {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .three-dot-item.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #04101A;
      border-color: transparent;
    }

    .notice-popup-card {
      background: linear-gradient(135deg, #10243E 0%, var(--card-bg) 100%);
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .closed-alert {
      background: var(--danger-bg);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #FCA5A5;
      border-radius: 14px;
      padding: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: rgba(11, 18, 30, 0.97);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      padding: 7px 4px 9px;
      z-index: 60;
    }

    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      padding: 3px 2px;
    }

    .nav-item.active { color: var(--gold); }
    .nav-ico { font-size: 17px; line-height: 1; }

    .float-support {
      position: fixed;
      bottom: 84px;
      right: max(14px, calc(50% - 204px));
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #04101A;
      border: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.35);
      cursor: pointer;
      z-index: 55;
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #132238;
      border: 1px solid var(--gold);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 10000;
      max-width: 390px;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .muted { color: var(--text-muted); font-size: 12px; }
    .bold { font-weight: 800; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .gap-8 { display: flex; flex-direction: column; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .copy-chip {
      background: var(--gold-soft);
      color: var(--gold-deep);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .empty-box {
      text-align: center;
      padding: 22px 14px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-warm);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .data-kv {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg-warm);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .kyc-preview-img {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .sync-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.16);

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const RTDB_URL = "https://ravion-official-default-rtdb.firebaseio.com/";
    const RTDB_PATH = "ravion_official/platform_state";

    const app = initializeApp({ databaseURL: RTDB_URL });
    const db = getDatabase(app);
    const stateRef = ref(db, RTDB_PATH);

    let suppressNextCloudPush = false;
    let lastCloudHash = "";

    function computeStateSyncSignature(obj) {
      if (!obj || typeof obj !== "object") return "";
      const usersCount = Array.isArray(obj.users) ? obj.users.length : 0;
      const depsCount = Array.isArray(obj.deposits) ? obj.deposits.length : 0;
      const wdsCount = Array.isArray(obj.withdrawals) ? obj.withdrawals.length : 0;
      const ordsCount = Array.isArray(obj.orders) ? obj.orders.length : 0;
      const pkgsCount = Array.isArray(obj.packages) ? obj.packages.length : 0;
      const balSum = (obj.users || []).reduce((acc, u) => acc + Number(u.balance || 0), 0).toFixed(2);
      return `${usersCount}|${depsCount}|${wdsCount}|${ordsCount}|${pkgsCount}|${balSum}`;
    }

    let cloudPushTimer = null;
    window.pushStateToFirebaseRTDB = function(stateObj) {
      if (suppressNextCloudPush || !stateObj || typeof stateObj !== "object") return;
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(async () => {
        try {
          const clone = JSON.parse(JSON.stringify(stateObj));
        delete clone.sessionPhone;
        delete clone.activeTab;
        delete clone.adminSubTab;
        delete clone.adminMenuOpen;
        delete clone.accountSubView;
        delete clone.selectedUserPhone;
        delete clone.selectedSupportUserPhone;
        delete clone.editingPkgId;

        const sig = computeStateSyncSignature(clone);
        lastCloudHash = sig;
        await set(stateRef, {
          payload: clone,
          updatedAt: Date.now()
        });
        const badge = document.getElementById("cloudSyncBadge");
        if (badge) {
          badge.textContent = "☁ Synced";
          badge.style.color = "#34D399";
        }
        } catch (err) {
          const badge = document.getElementById("cloudSyncBadge");
          if (badge) {
            badge.textContent = "☁ Local";
            badge.style.color = "#FBBF24";
          }
        }
      }, 350);
    };

    window.pullStateFromFirebaseRTDBOnce = async function() {
      try {
        const snap = await get(stateRef);
        if (snap.exists() && snap.val() && snap.val().payload) {
          suppressNextCloudPush = true;
          window.applyCloudStateSnapshot(snap.val().payload);
          setTimeout(() => { suppressNextCloudPush = false; }, 120);
        }
      } catch (e) {}
    };

    onValue(stateRef, (snap) => {
      if (!snap.exists() || !snap.val() || !snap.val().payload) return;
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA" || activeEl.tagName === "SELECT")) {
        return;
      }
      const cloudPayload = snap.val().payload;
      const incomingSig = computeStateSyncSignature(cloudPayload);
      const localSig = window.getCurrentComparableSignature ? window.getCurrentComparableSignature() : "";
      if (incomingSig === lastCloudHash || incomingSig === localSig) return;
      suppressNextCloudPush = true;
      window.applyCloudStateSnapshot(cloudPayload);
      setTimeout(() => { suppressNextCloudPush = false; }, 150);
    });

    function fnv1aHex(str, seed = 0x811c9dc5) {
      let h1 = seed >>> 0;
      let h2 = (seed ^ 0x9e3779b9) >>> 0;
      const input = String(str || '');
      for (let i = 0; i < input.length; i++) {
        const code = input.charCodeAt(i);
        h1 ^= code;
        h1 = Math.imul(h1, 0x01000193) >>> 0;
        h2 ^= (code + i);
        h2 = Math.imul(h2, 0x85ebca6b) >>> 0;
      }
      return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
    }

    function computeStrongDigest(payloadText) {
      const text = String(payloadText || '');
      const rounds = [0x811c9dc5, 0x1b873593, 0x27d4eb2f, 0x9e3779b1];
      let out = '';
      for (let r = 0; r < rounds.length; r++) {
        out += fnv1aHex(`${r}:${text.length}:${text}`, rounds[r]);
      }
      return out;
    }

        withdrawals: Array.isArray(parsed.withdrawals) ? parsed.withdrawals : [],
        bonusHistory: Array.isArray(parsed.bonusHistory) ? parsed.bonusHistory : base.bonusHistory,
        supportTickets: (parsed.supportTickets && typeof parsed.supportTickets === 'object') ? parsed.supportTickets : base.supportTickets,
        notifications: Array.isArray(parsed.notifications) ? parsed.notifications : base.notifications,
        activityLog: Array.isArray(parsed.activityLog) ? parsed.activityLog : []
      };
      verifyAndProtectUserData(hydrated);
      return hydrated;
    }

    function saveStateToStorage(obj) {
      sealAllUserRecords(obj);
      const serialized = JSON.stringify(obj);
      const envelope = wrapVaultEnvelope(obj);
      try { localStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
      try { localStorage.setItem(VAULT_BACKUP_KEY, envelope); } catch (e) {}
      try { sessionStorage.setItem(VAULT_BACKUP_KEY, envelope); } catch (e) {}
      try { window.name = 'RAVION_STATE:' + envelope; } catch (e) {}
      persistVaultToIndexedDB(envelope);
    }

    function loadState() {
      const candidates = [];
      try {
        const lsPrimary = localStorage.getItem(STORAGE_KEY);
        if (lsPrimary) candidates.push(parseVerifiedEnvelope(lsPrimary));
      } catch (e) {}
      try {
        const lsBackup = localStorage.getItem(VAULT_BACKUP_KEY);
        if (lsBackup) candidates.push(parseVerifiedEnvelope(lsBackup));
      } catch (e) {}
      try {
        const ssBackup = sessionStorage.getItem(VAULT_BACKUP_KEY);
        if (ssBackup) candidates.push(parseVerifiedEnvelope(ssBackup));
      } catch (e) {}
      try {
        if (window.name && window.name.startsWith('RAVION_STATE:')) {
          candidates.push(parseVerifiedEnvelope(window.name.slice('RAVION_STATE:'.length)));
        }
      } catch (e) {}

      const validCandidates = candidates.filter(Boolean);
      if (validCandidates.length === 0) {
        const base = createInitialState();
        saveStateToStorage(base);
        return base;
      }

      validCandidates.sort((a, b) => {
        const scoreA = (a.users ? a.users.length * 10 : 0) + (a.deposits ? a.deposits.length * 3 : 0) + (a.withdrawals ? a.withdrawals.length * 3 : 0) + (a.orders ? a.orders.length * 2 : 0);
        const scoreB = (b.users ? b.users.length * 10 : 0) + (b.deposits ? b.deposits.length * 3 : 0) + (b.withdrawals ? b.withdrawals.length * 3 : 0) + (b.orders ? b.orders.length * 2 : 0);
        return scoreB - scoreA;
      });

      const merged = mergeHydratedState(validCandidates[0]);
      saveStateToStorage(merged);
      return merged;
    }

    let state = loadState();
    recoverVaultFromIndexedDB();
    let coins = JSON.parse(JSON.stringify(DEFAULT_COINS));
    const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(CHANNEL_NAME) : null;

    window.getCurrentComparableSignature = function() {
      const usersCount = Array.isArray(state.users) ? state.users.length : 0;
      const depsCount = Array.isArray(state.deposits) ? state.deposits.length : 0;
      const wdsCount = Array.isArray(state.withdrawals) ? state.withdrawals.length : 0;
      const ordsCount = Array.isArray(state.orders) ? state.orders.length : 0;
      const pkgsCount = Array.isArray(state.packages) ? state.packages.length : 0;
      const balSum = (state.users || []).reduce((acc, u) => acc + Number(u.balance || 0), 0).toFixed(2);
      return `${usersCount}|${depsCount}|${wdsCount}|${ordsCount}|${pkgsCount}|${balSum}`;
    };

    window.applyCloudStateSnapshot = function(cloudPayload) {
      if (!cloudPayload || typeof cloudPayload !== "object") return;

    function saveState(broadcast = true, syncCloud = true) {
      saveStateToStorage(state);

      const nameInput = document.getElementById('regName').value.trim();
      const phone = normalizePhone(document.getElementById('regPhone').value.trim());
      const password = document.getElementById('regPass').value;
      const confirmPass = document.getElementById('regConfirmPass').value;
      const refCodeInput = (document.getElementById('regRef').value || '').trim().toUpperCase();
      const capInput = document.getElementById('regCaptcha').value.trim();

      if (!nameInput) return showToast('আপনার নাম লিখুন');
      if (!/^01[3-9]\d{8}$/.test(phone)) return showToast('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');

      if (password !== confirmPass) return showToast('কনফার্ম পাসওয়ার্ড মেলেনি');
      if (capInput !== state.captchaCode) {
        state.captchaCode = generateCaptcha();

      }

      let referredByPhone = null;
      if (refCodeInput) {
        const inviter = state.users.find(u => u.refCode === refCodeInput || normalizePhone(u.phone) === normalizePhone(refCodeInput));
        if (inviter && normalizePhone(inviter.phone) !== phone) referredByPhone = inviter.phone;
      }

      const isAdm = isAdminCredential(phone, password);
      const credRecord = buildCredentialRecord(phone, password);
      const newUser = {
        name: nameInput,
        customName: nameInput,
        customBio: '',
        avatarPhoto: '',
        verificationPhoto: '',
        verificationNumber: '',
        verificationStatus: isAdm ? 'Verified' : 'Unverified',
        phone,
        password,
        _authCred: credRecord,
        _finChecksum: '',
        refCode: makeRefCode(phone),
        referredBy: referredByPhone,
        balance: 0,
        totalDeposited: 0,
        totalWithdrawn: 0,
        referralBonusEarned: 0,
        levelCommissionEarned: 0,
        giftBonusEarned: 0,
        withdrawMethod: 'Nagad',
        withdrawNumber: phone,
        createdAt: new Date().toLocaleString('bn-BD')
      };
      newUser._finChecksum = computeUserFinancialChecksum(newUser, state.orders);

      state.users.push(newUser);
      ensureUserSupportAccount(newUser);
      state.sessionPhone = phone;
      state.activeTab = isAdm ? 'admin' : 'home';
      state.accountSubView = null;
      state.captchaCode = generateCaptcha();
      logActivity(`নতুন ইউজার রেজিস্ট্রেশন: ${nameInput} (${phone})`);
      saveState(true);
      hideSplash();
      showToast('অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!');

    function handleLogin(e) {
      e.preventDefault();
      const phone = normalizePhone(document.getElementById('loginPhone').value.trim());
      const password = document.getElementById('loginPass').value;

      if (!phone || !password) return showToast('মোবাইল নম্বর এবং পাসওয়ার্ড দিন');

      const rateCheck = checkLoginRateLimit(phone);
      if (rateCheck.locked) {
        return showToast(`অনেকবার ভুল চেষ্টা করা হয়েছে। ${rateCheck.remainingSec} সেকেন্ড পর আবার চেষ্টা করুন`);
      }

      if (isAdminCredential(phone, password)) {
        clearLoginAttempts(phone);
        let adminUser = state.users.find(u => normalizePhone(u.phone) === ADMIN_PHONE);
        if (!adminUser) {
          adminUser = {
            name: 'Admin (Mubarak)',
            customName: 'Admin (Mubarak)',
            customBio: 'System Administrator',
            avatarPhoto: '',
            verificationPhoto: '',
            verificationNumber: ADMIN_PHONE,
            verificationStatus: 'Verified',
            phone: ADMIN_PHONE,
            password: ADMIN_PASS,
            _authCred: buildCredentialRecord(ADMIN_PHONE, ADMIN_PASS),
            _finChecksum: '',
            refCode: makeRefCode(ADMIN_PHONE),
            referredBy: null,
            balance: 0,
            totalDeposited: 0,
            totalWithdrawn: 0,
            referralBonusEarned: 0,
            levelCommissionEarned: 0,
            giftBonusEarned: 0,
            withdrawMethod: 'bKash',
            withdrawNumber: ADMIN_PHONE,
            createdAt: new Date().toLocaleString('bn-BD')
          };
          adminUser._finChecksum = computeUserFinancialChecksum(adminUser, state.orders);
          state.users.push(adminUser);
        } else {
          adminUser.password = ADMIN_PASS;
          adminUser._authCred = buildCredentialRecord(ADMIN_PHONE, ADMIN_PASS, adminUser._authCred);
          adminUser.verificationStatus = 'Verified';
          adminUser._finChecksum = computeUserFinancialChecksum(adminUser, state.orders);
        }
        state.sessionPhone = adminUser.phone;
        state.activeTab = 'admin';
        state.adminSubTab = 'overview';
        state.adminMenuOpen = false;
        logActivity(`অ্যাডমিন লগইন করেছেন (${adminUser.phone})`);
        saveState(true);
        hideSplash();
        showToast('অ্যাডমিন প্যানেলে স্বাগতম!');
        renderApp();
        return;
      }

      const user = state.users.find(u => normalizePhone(u.phone) === phone);
      if (!user || !verifyUserPasswordExact(user, password)) {
        const failInfo = recordFailedLoginAttempt(phone);
        if (failInfo.lockUntil && failInfo.lockUntil > Date.now()) {
          return showToast('৫ বার ভুল পাসওয়ার্ড দেওয়ায় ৬০ সেকেন্ড লক করা হয়েছে');
        }
        return showToast('ভুল মোবাইল নম্বর বা পাসওয়ার্ড');
      }

      clearLoginAttempts(phone);

    function handleUserPhotoFile(inputEl, targetHiddenId, previewImgId) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const result = ev.target && ev.target.result;
        if (typeof result === 'string') {
          const hid = document.getElementById(targetHiddenId);
          if (hid) hid.value = result;
          const prev = document.getElementById(previewImgId);
          if (prev) {
            prev.src = result;
            prev.style.display = 'inline-block';
          }
          showToast('ছবি সিলেক্ট হয়েছে—Save বাটনে চাপুন');
        }
      };
      reader.readAsDataURL(file);
    }

    function applyDepositRewards(depositorUser, depositAmount) {
      const LEVEL_RATES = [0.10, 0.05, 0.03, 0.02, 0.01];
      let currentRefPhone = depositorUser.referredBy;
      let level = 1;
      const visited = new Set([normalizePhone(depositorUser.phone)]);

      while (currentRefPhone && level <= 5) {
        const normRef = normalizePhone(currentRefPhone);
        if (visited.has(normRef)) break;
        visited.add(normRef);

        const upline = state.users.find(u => normalizePhone(u.phone) === normRef);
        if (!upline) break;

        let added = 0;
        if (level === 1) {
          upline.balance = Number((Number(upline.balance || 0) + 30).toFixed(2));
          upline.referralBonusEarned = Number((Number(upline.referralBonusEarned || 0) + 30).toFixed(2));
          added += 30;
          addBonusHistory({
            userPhone: upline.phone,
            userName: upline.name,
            type: 'Referral Bonus',
            source: `Ref: ${depositorUser.phone}`,
            amount: 30,
            note: 'সরাসরি রেফার ডিপোজিট বোনাস'
          });
        }

        const pctBonus = Number((Number(depositAmount) * LEVEL_RATES[level - 1]).toFixed(2));
        if (pctBonus > 0) {
          upline.balance = Number((Number(upline.balance || 0) + pctBonus).toFixed(2));
          upline.levelCommissionEarned = Number((Number(upline.levelCommissionEarned || 0) + pctBonus).toFixed(2));
          added += pctBonus;
          addBonusHistory({
            userPhone: upline.phone,
            userName: upline.name,
            type: `Level ${level} Commission`,
            source: `From: ${depositorUser.phone}`,
            amount: pctBonus,
            note: `${Math.round(LEVEL_RATES[level - 1] * 100)}% ডিপোজিট কমিশন`
          });
        }

        if (added > 0) {
          logActivity(`Level ${level} কমিশন/বোনাস: ${upline.name} (${upline.phone}) পেয়েছেন ${formatBDT(added)}`);
        }

        currentRefPhone = upline.referredBy;
        level += 1;
      }
    }

    function adminUpdateUserBalanceAndPass(e, targetPhone) {
      e.preventDefault();
      const user = state.users.find(u => normalizePhone(u.phone) === normalizePhone(targetPhone));
      if (!user) return showToast('ইউজার পাওয়া যায়নি');

      const nextBalance = Number(document.getElementById('editUserBalance').value);
      const nextPass = document.getElementById('editUserPass').value.trim();

      if (isNaN(nextBalance) || nextBalance < 0) return showToast('সঠিক ব্যালেন্স দিন');
      if (!nextPass || nextPass.length < 4) return showToast('পাসওয়ার্ড অন্তত ৪ অক্ষরের হতে হবে');

      const prevBal = Number(user.balance || 0);
      user.balance = Number(nextBalance.toFixed(2));
      user.password = nextPass;
      syncUserCredentialRecord(user);

      if (user.balance > prevBal) {
        const diff = Number((user.balance - prevBal).toFixed(2));
        addBonusHistory({
          userPhone: user.phone,
          userName: user.name,
          type: 'Admin Balance Add',
          source: 'Admin Panel',
          amount: diff,
          note: 'অ্যাডমিন প্যানেল থেকে ব্যালেন্স যুক্ত'
        });
      }

      logActivity(`ইউজার এডিট [${user.phone}]: ব্যালেন্স ${formatBDT(user.balance)}, পাসওয়ার্ড আপডেট`);
      saveState(true);
      showToast(`${user.name}-এর ব্যালেন্স ও পাসওয়ার্ড আপডেট হয়েছে`);

    function adminSendNotification(e) {
      e.preventDefault();
      const title = document.getElementById('notifTitle').value.trim();
      const message = document.getElementById('notifMsg').value.trim();
      const days = Math.max(1, Number(document.getElementById('notifDays').value) || 1);
      if (!title || !message) return showToast('নোটিফিকেশনের শিরোনাম, বার্তা ও মেয়াদ দিন');

      const now = Date.now();
      const id = 'notif-' + now;
      state.notifications.unshift({
        id,
        title,
        message,
        days,
        expiresAt: now + days * 24 * 3600 * 1000,
        active: true,
        time: new Date(now).toLocaleString('bn-BD')
      });
      state.dismissedPopups = (state.dismissedPopups || []).filter(x => x !== id);

      logActivity(`নোটিফিকেশন প্রকাশ (${days} দিন): ${title}`);
      saveState(true);
      showToast(`${days} দিনের জন্য নোটিফিকেশন প্রকাশ হয়েছে`);
      renderApp();
    }

    function handleLogoFileUpload(inputEl, targetInputId) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const result = ev.target && ev.target.result;
        if (typeof result === 'string') {
          const inp = document.getElementById(targetInputId);
          if (inp) inp.value = result;
          showToast('লোগো ফাইল লোড হয়েছে—Save বাটনে চাপুন');
        }
      };
      reader.readAsDataURL(file);
    }

        return;
      }
      nav.style.display = 'grid';

      const items = [
        { id: 'home', ico: '🏠', label: 'Home' },
        { id: 'vip', ico: '💎', label: 'VIP' },
        { id: 'ordered', ico: '📦', label: 'Ordered' },
        { id: 'profit', ico: '📈', label: 'Profit' },
        { id: 'account', ico: '👤', label: 'Account' }
      ];

      if (isCurrentUserAdmin()) {
        items.push({ id: 'admin', ico: '🛠', label: 'Admin' });
      }

      nav.innerHTML = items.map(it => `
        <button class="nav-item ${state.activeTab === it.id ? 'active' : ''}" onclick="state.activeTab='${it.id}';state.accountSubView=null;renderApp();">
          <span class="nav-ico">${it.ico}</span>
          <span>${it.label}</span>
        </button>
      `).join('');
    }

    function renderApp() {
      try {
        applyBranding();
        document.body.classList.toggle('bn-font', state.lang === 'bn');
        const countEl = document.getElementById('notifCount');
        if (countEl) countEl.textContent = getActiveNotifications().length;

        const user = getCurrentUser();
        const root = document.getElementById('appRoot');

        if (!user) {
          renderBottomNav(null);
          root.innerHTML = renderAuthScreen();
          return;
        }

        if (state.activeTab === 'admin' && !isCurrentUserAdmin()) {
          state.activeTab = 'home';
        }

        ensureUserSupportAccount(user);
        renderBottomNav(user);

        if (state.activeTab === 'home') root.innerHTML = renderHomeTab(user);
        else if (state.activeTab === 'vip') root.innerHTML = renderVipTab(user);
        else if (state.activeTab === 'ordered') root.innerHTML = renderOrderedTab(user);
        else if (state.activeTab === 'profit') { root.innerHTML = renderProfitTab(user); setTimeout(calcRoiPreview, 0); }
        else if (state.activeTab === 'account') root.innerHTML = renderAccountTab(user);
        else if (state.activeTab === 'admin') root.innerHTML = renderAdminTab();
      } catch (err) {
        const root = document.getElementById('appRoot');
        if (root) {
          root.innerHTML = `<div class="main-content"><div class="closed-alert">অ্যাপ রেন্ডার করতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।</div></div>`;
        }
      }
    }


    function calcRoiPreview() {
      const amtEl = document.getElementById('roiCalcAmount');
      const daysEl = document.getElementById('roiCalcDays');
      const rateEl = document.getElementById('roiCalcRate');
      const outEl = document.getElementById('roiCalcResult');
      if (!amtEl || !daysEl || !rateEl || !outEl) return;
      const amt = Math.max(0, Number(amtEl.value) || 0);
      const days = Math.max(1, Number(daysEl.value) || 30);
      const dailyPct = Math.max(0, Number(rateEl.value) || 0);
      const dailyProfit = Number((amt * (dailyPct / 100)).toFixed(2));
      const totalProfit = Number((dailyProfit * days).toFixed(2));
      const totalReturn = Number((amt + totalProfit).toFixed(2));
      outEl.innerHTML = `
        <div class="pkg-stats mt-8">
          <div>
            <div class="stat-k">দৈনিক আনুমানিক আয়</div>
            <div class="stat-v" style="color:var(--success);">+${formatBDTExact(dailyProfit)}</div>
          </div>
          <div>
            <div class="stat-k">${days} দিনে মোট লাভ</div>
            <div class="stat-v" style="color:var(--gold);">+${formatBDTExact(totalProfit)}</div>
          </div>
          <div>
            <div class="stat-k">মোট রিটার্ন</div>
            <div class="stat-v">${formatBDTExact(totalReturn)}</div>
          </div>
        </div>
      `;
    }

    function exportFullPlatformBackup() {
      try {
        sealAllUserRecords(state);
        const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), state }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ravion-official-backup-' + Date.now() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('সম্পূর্ণ প্ল্যাটফর্ম ব্যাকআপ JSON ডাউনলোড হয়েছে');
      } catch (e) {
        showToast('ব্যাকআপ এক্সপোর্ট করা যায়নি');
      }
    }

    function importFullPlatformBackup(inputEl) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          const candidate = parsed && parsed.state && typeof parsed.state === 'object' ? parsed.state : parsed;
          if (!candidate || !Array.isArray(candidate.users)) {
            return showToast('সঠিক ব্যাকআপ ফাইল নয়');
          }
          const curSession = state.sessionPhone;
          state = mergeHydratedState(candidate);
          state.sessionPhone = curSession;
          state.activeTab = 'admin';
          saveState(true);
          showToast('ব্যাকআপ ডাটা সফলভাবে রিস্টোর ও সিঙ্ক হয়েছে!');
          renderApp();
        } catch (err) {
          showToast('ব্যাকআপ ফাইল পড়তে সমস্যা হয়েছে');
        }
      };
      reader.readAsText(file);
    }

    renderApp();
    calcRoiPreview();
    hideSplash();
  </script>
</body>
</html>
