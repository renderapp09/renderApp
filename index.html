<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ravion — Investment & Earning Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FBF7EE;
      --bg-warm: #F6EFE0;
      --card-bg: #FFFDF9;
      --card-tint: #FBF3E4;
      --gold: #D99B26;
      --gold-dark: #B57912;
      --gold-deep: #8F5C07;
      --gold-soft: rgba(217, 155, 38, 0.14);
      --text-main: #231A0B;
      --text-muted: #78694E;
      --border: #EADBC0;
      --success: #15803D;
      --success-bg: #DCFCE7;
      --danger: #B91C1C;
      --danger-bg: #FEE2E2;
      --warning: #B45309;
      --warning-bg: #FEF3C7;
      --shadow: 0 10px 28px rgba(120, 82, 16, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      background: #E9DEC8;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    }

    body.bn-font {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
    }

    .app-shell {
      max-width: 440px;
      min-height: 100dvh;
      margin: 0 auto;
      background: linear-gradient(180deg, #FDF9F1 0%, var(--bg-cream) 45%, var(--bg-warm) 100%);
      box-shadow: 0 18px 48px rgba(35, 26, 11, 0.16);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 84px;
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      max-width: 440px;
      margin: 0 auto;
      z-index: 9999;
      background: radial-gradient(circle at top, #FFF6E2 0%, #FBF3E2 55%, #F2E3C4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-badge {
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background: linear-gradient(135deg, #E5AA34 0%, #B77912 100%);
      color: #FFFDF9;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      box-shadow: 0 16px 32px rgba(181, 121, 18, 0.28);
      margin-bottom: 18px;
      animation: pulseLogo 1.4s ease-in-out infinite;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .splash-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
    }

    .splash-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .splash-bar {
      width: 210px;
      height: 6px;
      border-radius: 999px;
      background: rgba(181, 121, 18, 0.16);
      overflow: hidden;
    }

    .splash-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      border-radius: 999px;
      animation: load3s 2.2s linear forwards;
    }

    @keyframes load3s {
      from { width: 0%; }
      to { width: 100%; }
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(251, 247, 238, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 14px rgba(181, 121, 18, 0.22);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .main-content {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-wrapper {
      padding: 18px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-hero {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
        .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-warm);
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .auth-tab {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      box-shadow: 0 4px 12px rgba(181, 121, 18, 0.25);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .prefix-box {
      background: var(--bg-warm);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      font-weight: 800;
      font-size: 14px;
      color: var(--gold-deep);
    }

    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #FFFDF9;
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
    }

    .captcha-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .captcha-code {
      min-width: 96px;
      text-align: center;
      padding: 11px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, #F7E5C0, #EAD09C);
      border: 1px dashed var(--gold-dark);
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold-deep);
      font-size: 15px;
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      background: linear-gradient(135deg, #E3A52C 0%, #B3740E 100%);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(179, 116, 14, 0.24);
    }

    .btn-sm {
      border: none;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-approve { background: var(--success-bg); color: var(--success); }
    .btn-reject { background: var(--danger-bg); color: var(--danger); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .banner-card {
      background: linear-gradient(135deg, #3A2608 0%, #7C510D 58%, #C4871B 100%);
      color: #FFFDF9;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 26px rgba(124, 81, 13, 0.24);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .banner-pill {
      align-self: flex-start;
      background: rgba(255, 253, 249, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .quick-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .quick-ico {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gold-soft);
      color: var(--gold-deep);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title { font-size: 15px; font-weight: 800; }
    .ticker-list { display: flex; flex-direction: column; gap: 10px; }

    .ticker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--bg-warm);
      border: 1px solid rgba(234, 219, 192, 0.75);
      cursor: pointer;
    }

    .ticker-row.active { border-color: var(--gold); background: #FFF6E3; }

    .coin-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
      color: var(--gold-deep);
    }

    .change-up { color: var(--success); font-size: 12px; font-weight: 700; }
    .change-down { color: var(--danger); font-size: 12px; font-weight: 700; }

    .pkg-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pkg-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pkg-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold-deep);
    }

    .pkg-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-warm);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-k { font-size: 10px; color: var(--text-muted); font-weight: 600; }
    .stat-v { font-size: 13px; font-weight: 800; color: var(--text-main); margin-top: 2px; }

    .balance-card {
      background: linear-gradient(135deg, #D99B26 0%, #A96B0B 100%);
      color: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 24px rgba(169, 107, 11, 0.24);
    }

    .balance-amount { font-size: 28px; font-weight: 800; margin: 4px 0 12px; }
    .mini-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini-stat { background: rgba(255, 253, 249, 0.16); border-radius: 12px; padding: 9px 10px; }

    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .status-pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
    .st-pending { background: var(--warning-bg); color: var(--warning); }
    .st-approved { background: var(--success-bg); color: var(--success); }
    .st-rejected { background: var(--danger-bg); color: var(--danger); }

    .subtab-scroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
    .subtab-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .subtab-btn.active { background: var(--gold-dark); color: #fff; border-color: var(--gold-dark); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: rgba(255, 253, 249, 0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      padding: 7px 4px 9px;
      z-index: 60;
    }

    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      padding: 3px 2px;
    }

    .nav-item.active { color: var(--gold-deep); }
    .nav-ico { font-size: 17px; line-height: 1; }

    .float-support {
      position: fixed;
      bottom: 84px;
      right: max(14px, calc(50% - 204px));
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff;
      border: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(29, 78, 216, 0.3);
      cursor: pointer;
      z-index: 55;
  }
      .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #231A0B;
      color: #FFFDF9;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 10000;
      max-width: 390px;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .muted { color: var(--text-muted); font-size: 12px; }
    .bold { font-weight: 800; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .gap-8 { display: flex; flex-direction: column; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .copy-chip {
      background: var(--gold-soft);
      color: var(--gold-deep);
      border: 1px solid rgba(181, 121, 18, 0.28);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .empty-box {
      text-align: center;
      padding: 24px 14px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-warm);
      border-radius: 14px;
    }
  </style>
</head>
<body class="bn-font">
  <div id="splashScreen" class="splash-screen" onclick="hideSplash()">
    <div class="splash-badge">RC</div>
    <div class="splash-title">Ravion</div>
    <div id="splashSubtitle" class="splash-sub">ইনভেস্টমেন্ট ও টাস্ক প্ল্যাটফর্ম লোড হচ্ছে...</div>
    <div class="splash-bar">
      <div class="splash-bar-fill"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div class="app-shell">
    <header class="top-header">
      <div class="brand-row" onclick="goHomeOrAuth()">
        <div class="brand-icon">RC</div>
        <div>
          <div class="brand-title">Ravion</div>
          <div id="headerTagline" class="brand-sub">INVESTMENT PLATFORM</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="notifBellBtn" class="icon-btn" onclick="openNotifications()">🔔 <span id="notifCount">0</span></button>
        <button id="langToggleBtn" class="icon-btn" onclick="toggleLang()">EN / বাং</button>
      </div>
    </header>

    <div id="appRoot"></div>
    <button class="float-support" title="Support" onclick="showSupportInfo()">✈</button>
    <nav id="bottomNav" class="bottom-nav" style="display:none;"></nav>
  </div>

  <script>
          const STORAGE_KEY = 'ravion_live_state_v1';
    const CHANNEL_NAME = 'ravion_sync_channel_v1';
    const ADMIN_PHONE = '01873046713';
    const ADMIN_PASS = 'mubarak123';

    const DEFAULT_PACKAGES = [
      { id: 'intern', code: 'INTERN', name: 'Intern Trial Plan', price: 0, dailyIncome: 10, validityDays: 1, isFree: true },
      { id: 'r1', code: 'R1', name: 'VIP Plan R1', price: 350, dailyIncome: 12.25, validityDays: 180, isFree: false },
      { id: 'r2', code: 'R2', name: 'VIP Plan R2', price: 1500, dailyIncome: 52.5, validityDays: 180, isFree: false },
      { id: 'r3', code: 'R3', name: 'VIP Plan R3', price: 3000, dailyIncome: 105, validityDays: 180, isFree: false },
      { id: 'r4', code: 'R4', name: 'VIP Plan R4', price: 8000, dailyIncome: 280, validityDays: 180, isFree: false }
    ];

    const DEFAULT_COINS = [
      { symbol: 'BTC', name: 'Bitcoin', price: 94250.40, change: 2.34, series: [91800, 92400, 92150, 93100, 93800, 94250] },
      { symbol: 'ETH', name: 'Ethereum', price: 3280.75, change: 1.82, series: [3190, 3210, 3205, 3245, 3260, 3280] },
      { symbol: 'SOL', name: 'Solana', price: 214.60, change: -0.95, series: [220, 218, 219, 216, 215, 214.6] },
      { symbol: 'BNB', name: 'BNB Chain', price: 642.15, change: 1.12, series: [631, 634, 636, 639, 640, 642.15] },
      { symbol: 'XRP', name: 'Ripple', price: 1.48, change: 4.15, series: [1.39, 1.41, 1.42, 1.45, 1.47, 1.48] }
    ];

    function normalizePhone(raw) {
      let digits = String(raw || '').replace(/\D/g, '');
      if (digits.startsWith('880') && digits.length === 13) {
        digits = '0' + digits.slice(3);
      }
      return digits;
    }

    function isAdminCredential(phone, password) {
      return normalizePhone(phone) === ADMIN_PHONE && String(password || '') === ADMIN_PASS;
    }

    function getRefFromUrl() {
      const hash = window.location.hash || '';
      const qIdx = hash.indexOf('?ref=');
      if (qIdx !== -1) return hash.slice(qIdx + 5).trim().toUpperCase();
      const params = new URLSearchParams(window.location.search);
      return (params.get('ref') || '').trim().toUpperCase();
    }

    function generateCaptcha() {
      return String(Math.floor(10000 + Math.random() * 90000));
    }

    function createInitialState() {
      return {
        lang: 'bn',
        sessionPhone: null,
        authMode: 'login',
        activeTab: 'home',
        adminSubTab: 'overview',
        accountSubView: null,
        selectedCoin: 'BTC',
        captchaCode: generateCaptcha(),
        pendingRefCode: getRefFromUrl(),
        wallets: {
          nagad: '01863796311',
          bkash: '01873046713'
        },
        packages: DEFAULT_PACKAGES,
        users: [],
        orders: [],
        deposits: [],
        withdrawals: [],
        notifications: [
          {
            id: 'notif-welcome',
            title: 'Ravion প্ল্যাটফর্মে স্বাগতম',
            message: 'রেফার করা ইউজারের ডিপোজিট অনুমোদিত হলেই রেফারার পাবেন তাৎক্ষণিক ৩০ টাকা বোনাস এবং ৫-লেভেল কমিশন।',
            time: new Date().toLocaleString('bn-BD')
          }
        ],
        activityLog: []
      };
    }

    function saveStateToStorage(obj) {
      const serialized = JSON.stringify(obj);
      try { localStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
      try { window.name = 'RAVION_STATE:' + serialized; } catch (e) {}
    }

    function loadState() {
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (!raw && window.name && window.name.startsWith('RAVION_STATE:')) {
        raw = window.name.slice('RAVION_STATE:'.length);
      }
      if (!raw) {
        const init = createInitialState();
        saveStateToStorage(init);
        return init;
      }
      try {
        return { ...createInitialState(), ...JSON.parse(raw) };

    function applyDepositRewards(depositorUser, depositAmount) {
      const LEVEL_RATES = [0.10, 0.05, 0.03, 0.02, 0.01];
      let currentRefPhone = depositorUser.referredBy;
      let level = 1;
      const visited = new Set([normalizePhone(depositorUser.phone)]);

      while (currentRefPhone && level <= 5) {
        const normRef = normalizePhone(currentRefPhone);
        if (visited.has(normRef)) break;
        visited.add(normRef);

        const upline = state.users.find(u => normalizePhone(u.phone) === normRef);
        if (!upline) break;

        let added = 0;
        if (level === 1) {
          upline.balance = Number((Number(upline.balance || 0) + 30).toFixed(2));
          upline.referralBonusEarned = Number((Number(upline.referralBonusEarned || 0) + 30).toFixed(2));
          added += 30;
        }

        const pctBonus = Number((Number(depositAmount) * LEVEL_RATES[level - 1]).toFixed(2));
        if (pctBonus > 0) {
          upline.balance = Number((Number(upline.balance || 0) + pctBonus).toFixed(2));
          upline.levelCommissionEarned = Number((Number(upline.levelCommissionEarned || 0) + pctBonus).toFixed(2));
          added += pctBonus;
        }

        if (added > 0) {
          logActivity(`Level ${level} কমিশন/বোনাস: ${upline.name} (${upline.phone}) পেয়েছেন ${formatBDT(added)}`);
        }

        currentRefPhone = upline.referredBy;
        level += 1;
      }
    }

            <button class="icon-btn" style="align-self:flex-start;" onclick="state.accountSubView=null;renderApp();">← Back to Account</button>
            <div class="card gap-8">
              <div class="section-title">My Withdrawal History</div>
              ${myWithdrawals.length === 0 ? `<div class="empty-box">কোনো উত্তোলন রেকর্ড নেই</div>` : myWithdrawals.map(w => {
                const cls = w.status === 'Approved' ? 'st-approved' : w.status === 'Rejected' ? 'st-rejected' : 'st-pending';
                return `
                  <div class="ticker-row" style="cursor:default;">
                    <div>
                      <div class="bold" style="font-size:13px;">${formatBDT(w.amount)} • ${w.method}</div>
                      <div class="muted">${w.accountNumber} • ${w.createdAt}</div>
                    </div>
                    <span class="status-pill ${cls}">${w.status}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      if (sub === 'notifications') {
        return `
          <div class="main-content">
            <button class="icon-btn" style="align-self:flex-start;" onclick="state.accountSubView=null;renderApp();">← Back to Account</button>
            <div class="card gap-8">
              <div class="section-title">Notifications</div>
              ${state.notifications.map(n => `
                <div class="pkg-card" style="padding:12px;">
                  <div class="bold" style="font-size:14px;">${n.title}</div>
                  <div class="muted mt-8">${n.message}</div>
                  <div class="muted mt-8" style="font-size:10px;">${n.time}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="main-content">
          <div class="balance-card">
            <div style="font-size:12px;opacity:0.9;">${user.name} • ${user.phone}</div>
            <div class="balance-amount">${formatBDT(user.balance)}</div>
            <div class="mini-grid-3">
              <div class="mini-stat">
                <div style="font-size:10px;opacity:0.85;">Total Deposit</div>
                <div class="bold" style="font-size:13px;">${formatBDT(user.totalDeposited)}</div>
              </div>
              <div class="mini-stat">
                <div style="font-size:10px;opacity:0.85;">Total Withdraw</div>
                <div class="bold" style="font-size:13px;">${formatBDT(user.totalWithdrawn)}</div>
              </div>
              <div class="mini-stat">
                <div style="font-size:10px;opacity:0.85;">Ref Bonus</div>
                <div class="bold" style="font-size:13px;">${formatBDT(Number(user.referralBonusEarned || 0) + Number(user.levelCommissionEarned || 0))}</div>
              </div>
            </div>
          </div>

          <div class="quick-grid">
            <div class="quick-item" onclick="state.accountSubView='deposit';renderApp();">
              <div class="quick-ico">⬇</div>
              <span>Deposit</span>
            </div>
            <div class="quick-item" onclick="state.accountSubView='withdraw';renderApp();">
              <div class="quick-ico">⬆</div>
              <span>Withdraw</span>
            </div>
            <div class="quick-item" onclick="state.accountSubView='refer';renderApp();">
              <div class="quick-ico">🔗</div>
              <span>Refer Link</span>
            </div>
            <div class="quick-item" onclick="state.accountSubView='notifications';renderApp();">
              <div class="quick-ico">🔔</div>
              <span>Notice</span>
            </div>
          </div>

          <div class="menu-list">
            <div class="menu-row" onclick="state.accountSubView='deposits';renderApp();">
              <span>Deposit Records (${myDeposits.length})</span>
              <span>›</span>
            </div>
            <div class="menu-row" onclick="state.accountSubView='withdrawals';renderApp();">
              <span>Withdrawal Records (${myWithdrawals.length})</span>
              <span>›</span>
            </div>
            <div class="menu-row" onclick="state.accountSubView='refer';renderApp();">
              <span>My Referral Code: ${user.refCode}</span>
              <span>›</span>
            </div>
            <div class="menu-row" style="color:var(--danger);" onclick="logoutUser()">
              <span>Logout</span>
              <span>⎋</span>
            </div>
          </div>
        </div>
      `;
    }
        function renderAdminTab() {
      const totalApprovedDeposit = state.deposits
        .filter(d => d.status === 'Approved')
        .reduce((sum, d) => sum + Number(d.amount || 0), 0);
      const totalApprovedWithdraw = state.withdrawals
        .filter(w => w.status === 'Approved')
        .reduce((sum, w) => sum + Number(w.amount || 0), 0);

      const sub = state.adminSubTab || 'overview';
      const tabs = [
        { id: 'overview', label: 'Overview' },
        { id: 'deposits', label: `Deposits (${state.deposits.length})` },
        { id: 'withdrawals', label: `Withdrawals (${state.withdrawals.length})` },
        { id: 'users', label: `Users (${state.users.length})` },
        { id: 'packages', label: 'Add Package' },
        { id: 'referrals', label: 'Add Refer' },
        { id: 'wallets', label: 'Wallets' },
        { id: 'notify', label: 'Notify' }
      ];

      let bodyHtml = '';
      if (sub === 'overview') {
        bodyHtml = `
          <div class="mini-grid-2">
            <div class="card">
              <div class="muted">মোট ডিপোজিট (Approved)</div>
              <div class="bold mt-8" style="font-size:18px;color:var(--success);">${formatBDT(totalApprovedDeposit)}</div>
            </div>
            <div class="card">
              <div class="muted">মোট উত্তোলন (Approved)</div>
              <div class="bold mt-8" style="font-size:18px;color:var(--gold-deep);">${formatBDT(totalApprovedWithdraw)}</div>
            </div>
          </div>
          <div class="card gap-8">
            <div class="section-title">Live Activity Feed</div>
            ${state.activityLog.length === 0 ? `<div class="empty-box">এখনো কোনো কার্যক্রম হয়নি</div>` : state.activityLog.slice(0, 15).map(a => `
              <div class="ticker-row" style="cursor:default;">
                <span style="font-size:12px;">${a.text}</span>
                <span class="muted" style="font-size:10px;white-space:nowrap;">${a.time}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else if (sub === 'deposits') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">Deposit Approvals</div>
            ${state.deposits.length === 0 ? `<div class="empty-box">কোনো ডিপোজিট রিকোয়েস্ট নেই</div>` : state.deposits.map(d => {
              const cls = d.status === 'Approved' ? 'st-approved' : d.status === 'Rejected' ? 'st-rejected' : 'st-pending';
              return `
                <div class="pkg-card" style="padding:12px;">
                  <div class="row-between">
                    <div>
                      <div class="bold" style="font-size:14px;">${d.userName} (${d.userPhone})</div>
                      <div class="muted">${formatBDT(d.amount)} • ${d.method} • Sender: ${d.senderNumber}</div>
                      <div class="muted">TrxID: <b>${d.trxId}</b> • ${d.createdAt}</div>
                    </div>
                    <span class="status-pill ${cls}">${d.status}</span>
                  </div>
                  ${d.status === 'Pending' ? `
                    <div style="display:flex;gap:8px;margin-top:6px;">
                      <button class="btn-sm btn-approve" onclick="adminApproveDeposit('${d.id}')">Accept</button>
                      <button class="btn-sm btn-reject" onclick="adminRejectDeposit('${d.id}')">Reject</button>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (sub === 'withdrawals') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">Withdrawal Approvals</div>
            ${state.withdrawals.length === 0 ? `<div class="empty-box">কোনো উত্তোলন রিকোয়েস্ট নেই</div>` : state.withdrawals.map(w => {
              const cls = w.status === 'Approved' ? 'st-approved' : w.status === 'Rejected' ? 'st-rejected' : 'st-pending';
              return `
                <div class="pkg-card" style="padding:12px;">
                  <div class="row-between">
                    <div>
                      <div class="bold" style="font-size:14px;">${w.userName} (${w.userPhone})</div>
                      <div class="muted">${formatBDT(w.amount)} • ${w.method} • ${w.accountNumber}</div>
                      <div class="muted">${w.createdAt}</div>
                    </div>
                    <span class="status-pill ${cls}">${w.status}</span>
                  </div>
                  ${w.status === 'Pending' ? `
                    <div style="display:flex;gap:8px;margin-top:6px;">
                      <button class="btn-sm btn-approve" onclick="adminApproveWithdraw('${w.id}')">Accept</button>
                      <button class="btn-sm btn-reject" onclick="adminRejectWithdraw('${w.id}')">Reject</button>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (sub === 'users') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">All Users (Name, Number & Password)</div>
            ${state.users.length === 0 ? `<div class="empty-box">কোনো ইউজার নেই</div>` : state.users.map(u => `
              <div class="pkg-card" style="padding:12px;">
                <div class="row-between">
                  <div>
                    <div class="bold" style="font-size:14px;">${u.name}</div>
                    <div class="muted">Number: <b>${u.phone}</b> • Password: <b>${u.password}</b></div>
                    <div class="muted">Balance: <b>${formatBDT(u.balance)}</b> • Ref Code: ${u.refCode}</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (sub === 'packages') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">Add New Package</div>
            <form onsubmit="adminAddPackage(event)" class="gap-8" style="gap:10px;">
              <input id="pkgCode" class="input" type="text" placeholder="Code (যেমন: R5)" required />
              <input id="pkgName" class="input" type="text" placeholder="Package Name (যেমন: VIP Plan R5)" required />
              <input id="pkgPrice" class="input" type="number" min="0" placeholder="Price in BDT (যেমন: 5000)" required />
              <input id="pkgDaily" class="input" type="number" step="0.01" min="1" placeholder="Daily Income (যেমন: 180)" required />
              <input id="pkgDays" class="input" type="number" min="1" value="180" placeholder="Validity Days" required />
              <button type="submit" class="btn-primary">Add Package</button>
            </form>
          </div>
        `;
      } else if (sub === 'referrals') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">Add / Link Referral</div>
            <div class="muted">নতুন ইউজার নম্বর ও রেফারার নম্বর দিন:</div>
            <form onsubmit="adminAddReferral(event)" class="gap-8" style="gap:10px;">
              <input id="refChildPhone" class="input" type="tel" placeholder="Referred User Number (01XXXXXXXXX)" required />
              <input id="refParentPhone" class="input" type="tel" placeholder="Referrer / Upline Number (01XXXXXXXXX)" required />
              <button type="submit" class="btn-primary">Link Referral</button>
            </form>
          </div>
        `;
      } else if (sub === 'wallets') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">Update Payment Wallets</div>
            <form onsubmit="adminSaveWallets(event)" class="gap-8" style="gap:10px;">
              <div class="field-group">
                <label class="field-label">Nagad Send Money Number</label>
                <input id="walletNagad" class="input" type="tel" value="${state.wallets.nagad}" required />
              </div>
              <div class="field-group">
                <label class="field-label">bKash Send Money Number</label>
                <input id="walletBkash" class="input" type="tel" value="${state.wallets.bkash}" required />
              </div>
              <button type="submit" class="btn-primary">Save Wallets</button>
            </form>
          </div>
        `;
      } else if (sub === 'notify') {
        bodyHtml = `
          <div class="card gap-8">
            <div class="section-title">Send App Notification</div>
            <form onsubmit="adminSendNotification(event)" class="gap-8" style="gap:10px;">
              <input id="notifTitle" class="input" type="text" placeholder="Notification Title" required />
              <textarea id="notifMsg" class="textarea" rows="3" placeholder="Notification Message..." required></textarea>
              <button type="submit" class="btn-primary">Publish Notification</button>
            </form>
          </div>
        `;
      }

      return `
        <div class="main-content">
          <div class="card">
            <div class="section-title">Admin Control Panel</div>
            <div class="muted mt-8">ডিপোজিট, উত্তোলন, ইউজার পাসওয়ার্ড, প্যাকেজ, রেফার, ওয়ালেট ও নোটিফিকেশন কন্ট্রোল</div>
            <div class="subtab-scroll mt-12">
              ${tabs.map(t => `
                <button class="subtab-btn ${sub === t.id ? 'active' : ''}" onclick="state.adminSubTab='${t.id}';renderApp();">${t.label}</button>
              `).join('')}
            </div>
          </div>
          ${bodyHtml}
        </div>
      `;
    }

    function renderBottomNav(user) {
      const nav = document.getElementById('bottomNav');
      if (!user) {
        nav.style.display = 'none';
        return;
      }
      nav.style.display = 'grid';

      const items = [
        { id: 'home', ico: '🏠', label: 'Home' },
        { id: 'vip', ico: '💎', label: 'VIP' },
        { id: 'ordered', ico: '📦', label: 'Ordered' },
        { id: 'profit', ico: '📈', label: 'Profit' },
        { id: 'account', ico: '👤', label: 'Account' }
      ];

      if (isCurrentUserAdmin()) {
        items.push({ id: 'admin', ico: '🛠', label: 'Admin' });
      }

      nav.innerHTML = items.map(it => `
        <button class="nav-item ${state.activeTab === it.id ? 'active' : ''}" onclick="state.activeTab='${it.id}';state.accountSubView=null;renderApp();">
          <span class="nav-ico">${it.ico}</span>
          <span>${it.label}</span>
        </button>
      `).join('');
    }

    function renderApp() {
      document.getElementById('notifCount').textContent = state.notifications.length;
      const user = getCurrentUser();
      const root = document.getElementById('appRoot');

      if (!user) {
        renderBottomNav(null);
        root.innerHTML = renderAuthScreen();
        return;
      }

      if (state.activeTab === 'admin' && !isCurrentUserAdmin()) {
        state.activeTab = 'home';
      }

      renderBottomNav(user);

      if (state.activeTab === 'home') root.innerHTML = renderHomeTab(user);
      else if (state.activeTab === 'vip') root.innerHTML = renderVipTab(user);
      else if (state.activeTab === 'ordered') root.innerHTML = renderOrderedTab(user);
      else if (state.activeTab === 'profit') root.innerHTML = renderProfitTab(user);
      else if (state.activeTab === 'account') root.innerHTML = renderAccountTab(user);
      else if (state.activeTab === 'admin') root.innerHTML = renderAdminTab();
    }

    renderApp();
  </script>
</body>
</html>
